<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#08090d" />

    <meta name="description" content="OVC - Offline Video Calling" />

    <title>OVC - Offline Video Calling</title>

    <!-- PWA Manifest -->

    <link rel="manifest" href="manifest.json" />

    <!-- App Icon -->

    <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =====================================
         NAVIGATION
    ====================================== -->

    <nav>
      <div class="logo">OVC</div>

      <div class="navcontrols">
        <div class="nav-profile">👤</div>
      </div>
    </nav>

    <!-- =====================================
         LOGIN
    ====================================== -->

    <div class="login">
      <div class="login-main">
        <div class="login-gif-container">
          <img
            id="login-gif"
            src="assets/gifs/welcome.gif"
            alt="OVC Animation"
          />
        </div>

        <h1>OVC</h1>

        <p>Offline Video Calling</p>

        <div id="bot-message" class="bot-message">Hey! 👋</div>

        <div class="input">
          <div class="input-username">
            <label for="username"> Username </label>

            <div class="inputbox">
              <input
                type="text"
                required
                name="username"
                id="username"
                placeholder="Enter your username"
              />

              <button id="send" type="button">👉</button>
            </div>
          </div>

          <div class="input-gender">
            <label for="gender"> Gender </label>

            <select name="gender" id="gender">
              <option value="male">Male</option>

              <option value="female">Female</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- =====================================
         INSTALL OVC APP PROMPT
    ====================================== -->

    <div id="install-prompt" class="install-prompt">
      <div class="install-icon">📱</div>

      <div class="install-content">
        <h3>Install OVC</h3>

        <p>Install OVC on your device for a faster app-like experience.</p>
      </div>

      <button id="install-button" class="install-button">Install</button>

      <button
        id="close-install"
        class="close-install"
        aria-label="Close install prompt"
      >
        ✕
      </button>
    </div>

    <!-- =====================================
         TOAST
    ====================================== -->

    <div id="toast" class="toast">
      <span id="toast-icon"> ℹ️ </span>

      <span id="toast-message"> Welcome to OVC </span>
    </div>

    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script src="script.js"></script>
  </body>
</html>
