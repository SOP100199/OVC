<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#08090d" />

    <meta name="description" content="OVC - Offline Video Calling" />

    <title>OVC - Offline Video Calling</title>

    <!-- PWA -->

    <link rel="manifest" href="manifest.json" />

    <!-- App Icon -->

    <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />

    <!-- CSS -->

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- =====================================================
         NAVIGATION
    ====================================================== -->

    <nav>
      <div class="logo">OVC</div>

      <div class="navcontrols">
        <button class="nav-profile" id="nav-profile" type="button">👤</button>
      </div>
    </nav>

    <!-- =====================================================
         LOGIN PAGE
    ====================================================== -->

    <section class="login" id="login">
      <div class="login-main">
        <!--
                IMPORTANT:
                This welcome.gif stays on the login page.
            -->

        <div class="login-gif-container">
          <img
            id="login-gif"
            src="assets/gifs/welcome.gif"
            alt="OVC Welcome Animation"
          />
        </div>

        <h1>OVC</h1>

        <p class="login-title">Offline Video Calling</p>

        <!-- BOT MESSAGE -->

        <div id="bot-message" class="bot-message">Hey! 👋</div>

        <!-- INPUT -->

        <div class="input">
          <!-- USERNAME -->

          <div class="input-username">
            <label for="username"> Username </label>

            <div class="inputbox">
              <input
                type="text"
                required
                name="username"
                id="username"
                maxlength="30"
                autocomplete="off"
                placeholder="Enter your username"
              />

              <button id="send" type="button">👉</button>
            </div>
          </div>

          <!-- GENDER -->

          <div class="input-gender">
            <label for="gender"> Gender </label>

            <select name="gender" id="gender">
              <option value="male">Male</option>

              <option value="female">Female</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- =====================================================
         OVC MAIN APPLICATION
    ====================================================== -->

    <main id="videolayout" class="videolayout">
      <!-- =================================================
             USER HEADER
        ================================================== -->

      <div class="ovc-header">
        <div>
          <p class="small-label">Welcome to OVC</p>

          <h2 id="welcome-user">Hello!</h2>
        </div>

        <div id="user-avatar" class="user-avatar">👤</div>
      </div>

      <!-- =================================================
             MAIN STATUS AREA
        ================================================== -->

      <div class="videolayoutgrid">
        <!-- STATUS GIF -->

        <div class="status-container">
          <div class="status-gif-container">
            <img
              id="status-gif"
              src="assets/gifs/thinking.gif"
              alt="OVC Status"
            />
          </div>

          <h2 id="status-title">OVC is ready</h2>

          <p id="status-text">Waiting for someone to connect.</p>
        </div>

        <!-- =================================================
                 CALL AREA
            ================================================== -->

        <div id="call-area" class="call-area">
          <div class="call-placeholder">
            <div class="call-icon">📹</div>

            <h3>Ready for a call?</h3>

            <p>People connected to your local OVC network will appear here.</p>

            <button id="find-users" class="primary-button" type="button">
              🔍 Find People
            </button>
          </div>
        </div>
      </div>

      <!-- =================================================
             BOTTOM CONTROLS
        ================================================== -->

      <div class="controls">
        <button id="status-button" class="control-button" type="button">
          🔄 Check Network
        </button>

        <button id="logout-button" class="control-button danger" type="button">
          🚪 Logout
        </button>
      </div>
    </main>

    <!-- =====================================================
         INSTALL OVC APP PROMPT
    ====================================================== -->

    <div id="install-prompt" class="install-prompt">
      <div class="install-icon">📱</div>

      <div class="install-content">
        <h3>Install OVC</h3>

        <p>Install OVC on your device for a faster app-like experience.</p>
      </div>

      <button id="install-button" class="install-button" type="button">
        Install
      </button>

      <button
        id="close-install"
        class="close-install"
        type="button"
        aria-label="Close install prompt"
      >
        ✕
      </button>
    </div>

    <!-- =====================================================
         TOAST
    ====================================================== -->

    <div id="toast" class="toast">
      <span id="toast-icon"> ℹ️ </span>

      <span id="toast-message"> Welcome to OVC </span>
    </div>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="script.js"></script>
  </body>
</html>
